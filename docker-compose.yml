# Reference deployment: API + PostgreSQL. Secrets come from your shell / an untracked .env file (see .env.example); none are committed.
# NOT executed in the validation environment (Docker daemon unavailable); `docker compose config` is the only check that was possible.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rarediseases
      POSTGRES_USER: rd_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment or .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rd_app -d rarediseases"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://rd_app:${POSTGRES_PASSWORD}@db:5432/rarediseases
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?set the trusted frontend origin(s), comma-separated}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
    volumes:
      - ./models:/app/models:ro      # provision the model artifacts first (docs/DEPLOYMENT.md)
      - ./data:/app/data             # embeddings, indexes and processed tables
    ports:
      - "127.0.0.1:8000:8000"        # expose through a TLS-terminating reverse proxy, not directly

volumes:
  pgdata:
