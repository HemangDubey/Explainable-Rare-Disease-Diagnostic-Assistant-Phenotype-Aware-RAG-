<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="ggrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006874;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2540;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Central DNA/molecular structure -->
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="45" stroke="#006874" stroke-width="1" fill="none" opacity="0.15" stroke-dasharray="4 3"/>
  <circle cx="60" cy="60" r="30" stroke="#0a2540" stroke-width="1" fill="none" opacity="0.12" stroke-dasharray="3 4"/>
  
  <!-- Double Helix Main Structure -->
  <path d="M42 25C42 25 48 35 60 40C72 45 78 35 78 35" stroke="url(#ggrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M42 45C42 45 48 55 60 60C72 65 78 55 78 55" stroke="url(#ggrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M42 65C42 65 48 75 60 80C72 85 78 75 78 75" stroke="url(#ggrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M42 85C42 85 48 95 60 100C72 105 78 95 78 95" stroke="url(#ggrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  
  <!-- Cross rungs -->
  <line x1="46" y1="32" x2="74" y2="32" stroke="#006874" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="47" y1="52" x2="73" y2="52" stroke="#006874" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="46" y1="72" x2="74" y2="72" stroke="#006874" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="47" y1="92" x2="73" y2="92" stroke="#006874" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Connection nodes -->
  <circle cx="60" cy="40" r="4" fill="#006874"/>
  <circle cx="60" cy="60" r="5" fill="#0a2540"/>
  <circle cx="60" cy="80" r="4" fill="#006874"/>
  
  <!-- Satellite nodes -->
  <circle cx="42" cy="25" r="2.5" fill="#006874" opacity="0.8"/>
  <circle cx="78" cy="35" r="2.5" fill="#0a2540" opacity="0.8"/>
  <circle cx="42" cy="45" r="2.5" fill="#006874" opacity="0.8"/>
  <circle cx="78" cy="55" r="2.5" fill="#0a2540" opacity="0.8"/>
  <circle cx="42" cy="65" r="2.5" fill="#006874" opacity="0.8"/>
  <circle cx="78" cy="75" r="2.5" fill="#0a2540" opacity="0.8"/>
  
  <!-- Branching connections -->
  <line x1="60" y1="40" x2="30" y2="20" stroke="#006874" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
  <line x1="60" y1="40" x2="90" y2="20" stroke="#0a2540" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
  <line x1="60" y1="80" x2="30" y2="100" stroke="#006874" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
  <line x1="60" y1="80" x2="90" y2="100" stroke="#0a2540" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
  
  <!-- Tiny peripheral dots -->
  <circle cx="30" cy="20" r="2" fill="#006874" opacity="0.5"/>
  <circle cx="90" cy="20" r="2" fill="#0a2540" opacity="0.5"/>
  <circle cx="30" cy="100" r="2" fill="#006874" opacity="0.5"/>
  <circle cx="90" cy="100" r="2" fill="#0a2540" opacity="0.5"/>
</svg>
